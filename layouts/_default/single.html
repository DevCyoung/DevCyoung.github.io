{{ define "main" }}<article class="article"><header class="article-header shell-narrow"><div class="eyebrow"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006. 01. 02" }}</time><span>· {{ .ReadingTime }}분 읽기</span></div><h1>{{ .Title }}</h1>{{ with .Params.subtitle }}<p>{{ . }}</p>{{ end }}{{ with .GetTerms "tags" }}<div class="tag-row">{{ range . }}<a class="tag" href="{{ .RelPermalink }}">#{{ .LinkTitle }}</a>{{ end }}</div>{{ end }}</header>{{ with .Params.cover }}<figure class="article-cover shell"><img src="{{ . | relURL }}" alt=""></figure>{{ end }}<div class="prose shell-narrow">{{ .Content }}</div><footer class="article-footer shell-narrow"><a href="{{ "posts/" | relURL }}">← 모든 글로 돌아가기</a></footer></article>{{ end }}
