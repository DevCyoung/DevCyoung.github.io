baseURL = "https://devcyoung.github.io/"
locale = "ko-KR"
defaultContentLanguage = "ko"
title = "Hello Yoseo"
timeZone = "Asia/Seoul"
enableRobotsTXT = true
summaryLength = 38

[permalinks]
  posts = "/:year-:month-:day-:slug/"
[pagination]
  pagerSize = 6
[taxonomies]
  tag = "tags"
[params]
  author = "yoseo"
  description = "기록하고 배우며 나누는 개발 블로그"
  tagline = "배우고, 만들고, 기록합니다."
  avatar = "/assets/img/profile.jpg"
  github = "DevCyoung"
[[menu.main]]
  name = "글"
  pageRef = "/posts"
  weight = 10
[[menu.main]]
  name = "태그"
  pageRef = "/tags"
  weight = 20
[[menu.main]]
  name = "소개"
  pageRef = "/about"
  weight = 30
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
[markup.highlight]
  noClasses = false
  lineNos = false
[markup.goldmark.renderer]
  unsafe = true
[services.rss]
  limit = 20
